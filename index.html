<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XDZ Combat (Mini App)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --dark-bg: #1A1A1A;
            --main-text: #FFFFFF;
            --secondary-text: #A0A0A0;
            --accent-gold: #FFD700;
            --accent-red: #FF0040;
            --header-bg: #111111;
            --tap-area-circle: rgba(255, 0, 64, 0.2); /* Красное свечение вокруг хомяка */
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--main-text);
            overflow: hidden; /* Важно для мобильных приложений */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* -----------------------------------
           HEADER (Верхние награды)
           ----------------------------------- */
        .header-rewards {
            display: flex;
            justify-content: space-around;
            padding: 10px 10px 20px;
            background-color: var(--dark-bg);
        }

        .reward-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--header-bg);
            border-radius: 10px;
            padding: 10px;
            width: 30%;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .reward-item.active {
            opacity: 1;
            border-color: var(--accent-gold);
        }

        .reward-icon {
            width: 40px;
            height: 40px;
            background-color: #333;
            border-radius: 5px;
            margin-bottom: 5px;
            /* Заглушки для иконок */
            background-size: cover;
        }
        .reward-item:nth-child(1) .reward-icon { background-image: url('https://placehold.co/40x40/4CAF50/white?text=D'); }
        .reward-item:nth-child(2) .reward-icon { background-image: url('https://placehold.co/40x40/FF5722/white?text=C'); }
        .reward-item:nth-child(3) .reward-icon { background-image: url('https://placehold.co/40x40/2196F3/white?text=K'); }


        .reward-item .title {
            font-size: 11px;
            font-weight: bold;
            color: var(--secondary-text);
        }

        .reward-item .timer {
            font-size: 10px;
            color: var(--secondary-text);
        }
        
        .reward-item.active .reward-icon::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #4CAF50;
            color: white;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            line-height: 15px;
            font-size: 10px;
        }
        
        /* -----------------------------------
           MAIN CONTENT
           ----------------------------------- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            overflow-y: auto;
            position: relative;
        }

        .balance-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .balance-value {
            font-size: 32px;
            font-weight: 900;
            margin-top: 10px;
            letter-spacing: -1px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .balance-label {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--secondary-text);
            margin-bottom: 15px;
        }
        
        .balance-label .coin-icon {
            width: 20px;
            height: 20px;
            margin-right: 5px;
            /* Заглушка для монеты */
            background-image: url('https://placehold.co/20x20/FFD700/000000?text=$');
            background-size: cover;
            border-radius: 50%;
        }

        /* Daily Cipher block */
        .daily-cipher-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .cipher-label {
            font-size: 14px;
            font-weight: bold;
        }

        .cipher-reward-button {
            background-color: #32CD32; /* Lime green */
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* -----------------------------------
           HAMSTER TAP AREA
           ----------------------------------- */
        .tap-area {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Имитация красного круга */
            background: radial-gradient(circle, var(--tap-area-circle) 0%, rgba(255, 0, 64, 0) 70%);
            border-radius: 50%;
            box-shadow: 0 0 40px var(--accent-red);
            cursor: pointer;
        }

        .hamster-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #333333;
            overflow: hidden;
            border: 5px solid var(--dark-bg); /* Имитация рамки */
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .hamster-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Заглушка для хомяка */
            background-image: url('https://placehold.co/250x250/5D5D5D/white?text=HAMSTER');
            background-size: cover;
            border-radius: 50%;
        }
        
        /* -----------------------------------
           BOTTOM NAVIGATION (Нижнее меню)
           ----------------------------------- */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            background-color: var(--header-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: env(safe-area-inset-bottom); /* Учет безопасной области на iOS */
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--secondary-text);
            padding: 5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--main-text);
            font-weight: bold;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            /* Заглушки для иконок */
            background-color: #555;
            border-radius: 50%;
            background-size: 60%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .nav-item.active .nav-icon {
            background-color: var(--accent-gold);
        }

        /* Имитация иконок */
        .nav-item:nth-child(1) .nav-icon { background-image: url('https://placehold.co/24x24/555/white?text=E'); }
        .nav-item:nth-child(2) .nav-icon { background-image: url('https://placehold.co/24x24/555/white?text=M'); }
        .nav-item:nth-child(3) .nav-icon { background-image: url('https://placehold.co/24x24/555/white?text=F'); }
        .nav-item:nth-child(4) .nav-icon { background-image: url('https://placehold.co/24x24/555/white?text=R'); }
        .nav-item:nth-child(5) .nav-icon { background-image: url('https://placehold.co/24x24/555/white?text=A'); }
        
        .nav-item.active:nth-child(1) .nav-icon { background-color: var(--accent-gold); }

        /* Эффект для клика (анимация) */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .click-animation {
            position: absolute;
            font-size: 30px;
            font-weight: bold;
            color: var(--accent-gold);
            pointer-events: none;
            animation: pulse 0.5s ease-out forwards;
        }

        /* -----------------------------------
           JS INIT & TAP
           ----------------------------------- */
        .init-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 20px;
        }

    </style>
</head>
<body>

    <div class="header-rewards">
        <div class="reward-item">
            <div class="reward-icon"></div>
            <span class="title">Daily reward</span>
            <span class="timer" id="daily-reward-timer">03:53</span>
        </div>
        <div class="reward-item active">
            <div class="reward-icon"></div>
            <span class="title">Daily cipher</span>
            <span class="timer" id="daily-cipher-timer">22:53</span>
        </div>
        <div class="reward-item">
            <div class="reward-icon"></div>
            <span class="title">Daily combo</span>
            <span class="timer" id="daily-combo-timer">15:53</span>
        </div>
    </div>

    <div class="main-content">
        <div class="balance-section">
            <div class="balance-label">
                <div class="coin-icon"></div>
                <div class="cipher-label">Daily cipher</div> 
            </div>
            <div class="balance-value" id="balance-display">592,325,819</div>
        </div>
        
        <div class="daily-cipher-block">
            <span class="cipher-label">Daily cipher</span>
            <button class="cipher-reward-button" onclick="claimCipher()">+1,000,000</button>
        </div>

        <div class="tap-area" id="tap-area">
            <div class="hamster-circle">
                <div class="hamster-image"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon"></div>
            <span>Exchange</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon"></div>
            <span>Mine</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon"></div>
            <span>Friends</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon"></div>
            <span>Earn</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon"></div>
            <span>Airdrop</span>
        </div>
    </div>

    <script>
        const tapArea = document.getElementById('tap-area');
        const balanceDisplay = document.getElementById('balance-display');
        let currentBalance = 592325819; // Начальный баланс

        // Инициализация Web App
        Telegram.WebApp.ready();
        Telegram.WebApp.setBackgroundColor('#1A1A1A');

        // 1. Обработка клика (для примера)
        tapArea.addEventListener('click', (e) => {
            // Координаты для анимации
            const rect = tapArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Добавляем монеты (увеличиваем баланс для примера)
            const clickAmount = 1;
            currentBalance += clickAmount;
            balanceDisplay.textContent = currentBalance.toLocaleString('en-US');

            // Создание и запуск анимации
            const anim = document.createElement('div');
            anim.className = 'click-animation';
            anim.textContent = `+${clickAmount}`;
            anim.style.left = `${x}px`;
            anim.style.top = `${y}px`;
            
            tapArea.appendChild(anim);

            // Удаление элемента после завершения анимации
            anim.addEventListener('animationend', () => {
                anim.remove();
            });

            // ОТПРАВКА ДАННЫХ В БОТА
            // Эту часть нужно будет доработать для отправки реальных данных
            // Telegram.WebApp.sendData(JSON.stringify({
            //     action: 'click',
            //     coins: currentBalance
            // }));
        });

        // 2. Имитация функции получения Daily Cipher
        function claimCipher() {
            const reward = 1000000;
            currentBalance += reward;
            balanceDisplay.textContent = currentBalance.toLocaleString('en-US');
            
            // В реальном приложении: скрыть кнопку, обновить таймер, отправить данные на сервер.
            const button = document.querySelector('.cipher-reward-button');
            button.textContent = 'Claimed!';
            button.disabled = true;
            button.style.backgroundColor = '#555';
            
            // ОТПРАВКА ДАННЫХ В БОТА
            // Telegram.WebApp.sendData(JSON.stringify({
            //     action: 'claim_cipher',
            //     coins: currentBalance
            // }));
        }

    </script>
</body>
</html>

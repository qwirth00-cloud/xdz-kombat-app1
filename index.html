<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XDZ Kombat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #1C1C1E;
            --primary-orange: #FF9500;
            --accent-green: #34C759;
            --text-light: #EBEBF5;
            --card-bg: #2C2C2E;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .container {
            padding: 0 15px;
        }

        /* --- Header & Balance --- */
        .header {
            padding: 20px 0;
            text-align: center;
        }
        #balance-display {
            font-size: 3.5em;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #balance-display span { margin-left: 10px; }
        .income-info {
            color: #8E8E93;
            font-size: 1.1em;
        }

        /* --- Click Area --- */
        #click-area {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at center, #ffad33 0%, var(--primary-orange) 100%);
            border-radius: 50%;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 149, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s ease;
            user-select: none;
        }
        #click-area:active {
            transform: scale(0.95);
        }

        /* --- Navigation --- */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            border-top: 1px solid #3A3A3C;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            cursor: pointer;
            color: #8E8E93;
            font-size: 0.8em;
            padding: 5px;
        }
        .nav-item.active {
            color: var(--primary-orange);
        }

        /* --- Section Styling (Cards) --- */
        .section {
            padding-bottom: 100px; /* Учитываем высоту навигации */
            display: none;
        }
        .section.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            text-align: left;
        }
        .card-header {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary-orange);
        }
        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #3A3A3C;
        }
        .upgrade-item:last-child {
            border-bottom: none;
        }
        .upgrade-details strong {
            display: block;
            font-size: 1.1em;
        }
        .upgrade-details span {
            font-size: 0.9em;
            color: #8E8E93;
        }
        .buy-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .buy-btn:disabled {
            background-color: #5A5A5C;
        }
        .buy-btn:not(:disabled):active {
            background-color: #27ae60;
        }

        /* --- Promo Section --- */
        .promo-input-group {
            display: flex;
            margin-top: 15px;
        }
        #promo-input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 8px 0 0 8px;
            border: 1px solid #5A5A5C;
            background-color: #1C1C1E;
            color: var(--text-light);
        }
        #promo-button {
            background-color: var(--primary-orange);
            color: var(--bg-dark);
            border: none;
            padding: 10px 15px;
            border-radius: 0 8px 8px 0;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">

        <div id="section-home" class="section active">
            <div class="header">
                <div id="balance-display">
                    💎 <span id="current-coins">0</span>
                </div>
                <div class="income-info">
                    +<span id="income-per-click">1</span> в клик
                </div>
            </div>

            <div id="click-area">
                ⚡
            </div>
            
            <div class="card">
                <div class="card-header">👤 Статус</div>
                <div id="profile-details">
                    <div class="upgrade-item">
                        <span>Уровень клика:</span>
                        <strong id="click-level">0</strong>
                    </div>
                    <div class="upgrade-item">
                        <span>VIP Статус:</span>
                        <strong id="vip-status">❌ Нет</strong>
                    </div>
                    <div class="upgrade-item">
                        <span>Общий буст:</span>
                        <strong id="total-boost">0%</strong>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-upgrade" class="section">
            <h2 style="text-align: center;">✨ Прокачки</h2>
            <div class="card">
                <div class="card-header">⛏️ Улучшение дохода за клик</div>
                <div id="upgrade-list">
                    <div class="upgrade-item">
                        <div class="upgrade-details">
                            <strong>Уровень 1</strong>
                            <span>+2 XDZ | 15 🪙</span>
                        </div>
                        <button class="buy-btn" data-type="click_level" data-level="1" data-cost="15">Купить</button>
                    </div>
                    <div class="upgrade-item">
                        <div class="upgrade-details">
                            <strong>VIP</strong>
                            <span>+50% Буст | 500 🪙</span>
                        </div>
                        <button class="buy-btn" data-type="vip_status" data-cost="500">Купить</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-promo" class="section">
            <h2 style="text-align: center;">🎁 Промокоды</h2>
            <div class="card">
                <div class="card-header">Активация</div>
                <div class="promo-input-group">
                    <input type="text" id="promo-input" placeholder="Введите промокод..." maxlength="20">
                    <button id="promo-button">Ввести</button>
                </div>
                <p style="font-size: 0.9em; color: #8E8E93; margin-top: 15px;">
                    Вводите код и получайте бесплатные монеты!
                </p>
                <div id="promo-message" style="margin-top: 10px; color: var(--accent-green); font-weight: 600;"></div>
            </div>
        </div>
        
    </div>

    <div class="nav-bar">
        <div class="nav-item active" data-target="home">
            🏠 Главная
        </div>
        <div class="nav-item" data-target="upgrade">
            ✨ Прокачки
        </div>
        <div class="nav-item" data-target="promo">
            🎁 Промо
        </div>
        <div class="nav-item" data-target="withdraw">
            💰 Вывод
        </div>
    </div>


    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ (Синхронизируются с ботом) ---
        let userState = {
            coins: 0,
            income: 1,
            level_click: 0,
            is_vip: false
        };
        const UPGRADE_COSTS = [
            { level: 1, bonus: 2, cost: 15 },
            { level: 2, bonus: 5, cost: 30 },
            { level: 3, bonus: 15, cost: 50 },
            { level: 4, bonus: 30, cost: 100 }
        ];

        // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP ---
        if (window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand(); // Разворачиваем на весь экран
            // Убираем MainButton, т.к. используем нижнюю навигацию
            Telegram.WebApp.MainButton.hide(); 
        }

        // --- ЛОГИКА СИНХРОНИЗАЦИИ И ОТПРАВКИ ДАННЫХ ---

        function sendDataToBot(data) {
            if (window.Telegram.WebApp) {
                const dataString = JSON.stringify(data);
                Telegram.WebApp.sendData(dataString);
            }
            // В реальном приложении здесь должен быть лог
            console.log("Отправка боту:", data); 
        }

        // Функция обновления UI на основе userState
        function updateUI() {
            document.getElementById('current-coins').textContent = userState.coins.toLocaleString();
            document.getElementById('income-per-click').textContent = userState.income.toLocaleString();
            document.getElementById('click-level').textContent = userState.level_click;
            document.getElementById('vip-status').textContent = userState.is_vip ? '✅ Активен' : '❌ Нет';
            
            // Расчет буста (упрощенно)
            const boost = userState.is_vip ? 50 : 0;
            document.getElementById('total-boost').textContent = `${boost}%`;

            // Обновление кнопок прокачек
            renderUpgrades();
        }

        // Симуляция получения данных от бота (В РЕАЛЬНОСТИ ЭТО ПРИХОДИТ ИЗ PYTHON)
        // Для демонстрации, будем вызывать это при загрузке.
        function simulateSyncData(data) {
             // Здесь бот должен отправить JSON с актуальными данными
             // userState = data;
             // updateUI();
        }


        // --- ОБРАБОТЧИКИ СОБЫТИЙ ---

        // 1. Клик по кнопке
        document.getElementById('click-area').addEventListener('click', () => {
            userState.coins += userState.income; // Локальное начисление
            updateUI();
            
            // Отправка запроса на сохранение
            sendDataToBot({ 
                action: 'click', 
                coins: userState.coins // Отправляем текущий баланс для сохранения
            });
        });

        // 2. Навигация
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                
                const target = this.getAttribute('data-target');
                document.getElementById(`section-${target}`).classList.add('active');
                this.classList.add('active');

                // Специальные действия для некоторых кнопок
                if (target === 'withdraw') {
                    // Отправляем запрос на вывод. Бот должен ответить в чате.
                    sendDataToBot({ action: 'withdraw_request' });
                    // Возвращаем на главную, чтобы не зависать
                    document.getElementById(`section-home`).classList.add('active');
                    document.querySelector('.nav-item[data-target="home"]').classList.add('active');
                    Telegram.WebApp.showAlert('Запрос на вывод отправлен боту. Проверьте чат!');
                }
            });
        });

        // 3. Логика покупки прокачек (Симуляция)
        document.getElementById('upgrade-list').addEventListener('click', function(e) {
            if (e.target.classList.contains('buy-btn') && !e.target.disabled) {
                const cost = parseInt(e.target.getAttribute('data-cost'));
                const type = e.target.getAttribute('data-type');
                
                if (userState.coins >= cost) {
                    userState.coins -= cost;
                    
                    if (type === 'click_level') {
                        // Логика прокачки уровня
                        userState.level_click += 1;
                        userState.income += UPGRADE_COSTS[userState.level_click - 1].bonus;
                    } else if (type === 'vip_status') {
                        // Логика VIP
                        userState.is_vip = true;
                    }

                    // Отправка запроса на покупку
                    sendDataToBot({ 
                        action: 'buy_upgrade', 
                        type: type, 
                        cost: cost 
                    });

                    updateUI();
                    Telegram.WebApp.showPopup({ message: 'Успешно куплено!' });
                } else {
                    Telegram.WebApp.showAlert('Недостаточно монет!');
                }
            }
        });
        
        // 4. Логика промокодов
        document.getElementById('promo-button').addEventListener('click', () => {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            if (code) {
                // Отправляем код боту. Бот должен обработать его FSM.
                sendDataToBot({ action: 'activate_promo', code: code });
                document.getElementById('promo-input').value = '';
                document.getElementById('promo-message').textContent = 'Отправлено боту. Ждите ответа...';
            }
        });

        // 5. Рендеринг кнопок прокачек (динамическое обновление)
        function renderUpgrades() {
            const list = document.getElementById('upgrade-list');
            list.innerHTML = ''; // Очистка

            // --- Кнопки уровня клика ---
            const nextLevelIndex = userState.level_click;
            if (nextLevelIndex < UPGRADE_COSTS.length) {
                const upg = UPGRADE_COSTS[nextLevelIndex];
                const btnText = userState.coins >= upg.cost ? 'Купить' : `${upg.cost} 🪙`;
                const isDisabled = userState.coins < upg.cost;

                const itemHtml = `
                    <div class="upgrade-item">
                        <div class="upgrade-details">
                            <strong>⛏️ Ур. ${upg.level + 1}</strong>
                            <span>+${upg.bonus} XDZ | ${upg.cost} 🪙</span>
                        </div>
                        <button class="buy-btn" data-type="click_level" data-cost="${upg.cost}" ${isDisabled ? 'disabled' : ''}>${btnText}</button>
                    </div>
                `;
                list.innerHTML += itemHtml;
            } else {
                 list.innerHTML += `<div class="upgrade-item"><strong>⛏️ Уровень клика:</strong> <span>MAX</span></div>`;
            }

            // --- Кнопка VIP ---
            if (!userState.is_vip) {
                const cost = 500;
                const btnText = userState.coins >= cost ? 'Купить' : `${cost} 🪙`;
                const isDisabled = userState.coins < cost;
                const vipHtml = `
                    <div class="upgrade-item">
                        <div class="upgrade-details">
                            <strong>👑 VIP Статус</strong>
                            <span>+50% Буст | ${cost} 🪙</span>
                        </div>
                        <button class="buy-btn" data-type="vip_status" data-cost="${cost}" ${isDisabled ? 'disabled' : ''}>${btnText}</button>
                    </div>
                `;
                list.innerHTML += vipHtml;
            } else {
                list.innerHTML += `<div class="upgrade-item"><strong>👑 VIP Статус:</strong> <span>Активен</span></div>`;
            }
        }


        // --- ИНИЦИАЛИЗАЦИЯ ---
        updateUI(); // Первичная отрисовка
        // В реальном приложении: запросить актуальный баланс у бота после window.Telegram.WebApp.ready();
    </script>
</body>
</html>
